<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão Brasil x Haiti</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#0b6623;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;width:400px;max-width:95%;padding:24px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.3)}
h1{text-align:center;color:#0b6623}
.jogo{text-align:center;font-size:30px;font-weight:bold;margin:20px 0}
label{font-weight:bold}
input,select,button{width:100%;padding:12px;border-radius:8px;margin-top:8px}
.placares{display:flex;gap:20px;margin:20px 0}
.time{flex:1;text-align:center}
button{background:#0b6623;color:#fff;border:none;font-size:18px;cursor:pointer}
button:hover{background:#084b19}
#msg{text-align:center;color:#0b6623;font-weight:bold;margin-top:20px}
</style>
</head>
<body>
<div class="card">
<h1>⚽ BOLÃO</h1>
<div class="jogo">🇧🇷 Brasil<br>X<br>🇭🇹 Haiti</div>

<label>Seu nome</label>
<input id="nome" placeholder="Digite seu nome">

<div class="placares">
<div class="time">
<h3>🇧🇷 Brasil</h3>
<select id="brasil"></select>
</div>
<div class="time">
<h3>🇭🇹 Haiti</h3>
<select id="haiti"></select>
</div>
</div>

<button onclick="salvar()">💾 SALVAR PALPITE</button>

<div id="msg"></div>

</div>

<script>
for(let i=0;i<=10;i++){
brasil.innerHTML+=`<option>${i}</option>`;
haiti.innerHTML+=`<option>${i}</option>`;
}

function salvar(){
let nome=document.getElementById("nome").value.trim();
if(nome===""){
alert("Digite seu nome!");
return;
}
let b=document.getElementById("brasil").value;
let h=document.getElementById("haiti").value;

document.getElementById("msg").innerHTML=
`✅ Obrigado <b>${nome}</b><br>Seu palpite foi <b>Brasil ${b} x ${h} Haiti</b>`;

console.log({nome:nome,brasil:b,haiti:h});

document.getElementById("nome").value="";
document.getElementById("brasil").selectedIndex=0;
document.getElementById("haiti").selectedIndex=0;
}
</script>

</body>
</html>
